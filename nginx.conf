set_real_ip_from 172.18.0.0/16;
set_real_ip_from 172.17.0.0/16;

real_ip_header X-Forwarded-For;
real_ip_recursive on;

log_format sec '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

map $status $should_log_error {
  ~^[23] 0;
  default 1;
}

map $request_uri $should_log_sensitive {
  ~*^/(?:\.env|\.git|env|api/config(?:/|$)|api_keys(?:/|$)|storage/(?:logs(?:/|$)|framework/cache/data(?:/|$))|.*\.(?:log|env)$|(?:aws|sendgrid|sendinblue)_?keys\.json|tsconfig\.json) 1;
  default 0;
}

map "$should_log_error$should_log_sensitive" $should_access_log {
  "10" 1;
  "01" 1;
  "11" 1;
  default 0;
}

server {
  listen 8080;
  server_name _;

  include /var/lib/denylist/denylist.conf;

  access_log /var/log/nginx/access.log sec if=$should_access_log buffer=32k flush=1s;
  error_log /dev/stderr warn;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  location ~* ^/assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~ ^/(api|storage) {
    proxy_pass http://127.0.0.1:${APP_PORT};
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer-when-downgrade always;
}
