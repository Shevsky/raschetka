name: Build and deploy to server

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      # Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # Посылаем сообщение, что деплой начался
      - name: Notify start
        id: notify_start
        env:
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          JOB_URL=$(curl -sS -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            | jq -r '.jobs[] | select(.name|ascii_downcase=="deploy") | .html_url' | head -n1)

          if [ -z "$JOB_URL" ] || [ "$JOB_URL" = "null" ]; then
            JOB_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          TEXT="$(printf '%s\n\n%s' '🚀 Деплой начался' "$JOB_URL")"

          RESP=$(curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d disable_web_page_preview=true \
            --data-urlencode text="$TEXT")
          MSG_ID=$(echo "$RESP" | jq -r '.result.message_id')

          echo "message_id=$MSG_ID" >> "$GITHUB_OUTPUT"
          echo "job_url=$JOB_URL"   >> "$GITHUB_OUTPUT"

      # Устанавливаем Docker
      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      # Собираем Docker-образ
      - name: Build Docker image
        run: |
          docker build -t raschetka .
          docker save -o raschetka.tar raschetka
          gzip raschetka.tar

      # Устанавливаем SSH-ключ
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Копируем архив с Docker-образом на сервер
      - name: Copy new app to external server
        run: |
          rsync -avz --progress -e "ssh -o StrictHostKeyChecking=no" \
            raschetka.tar.gz docker-compose.yml \
            "${{ vars.EXTERNAL_SERVER_USER }}@${{ vars.EXTERNAL_SERVER_IP_ADDR }}:${{ vars.EXTERNAL_SERVER_DESTINATION }}/"

      # Запускаем обновленный образ бота на сервере
      - name: Run new app on external server
        run: |
          ssh -t -o StrictHostKeyChecking=no ${{ vars.EXTERNAL_SERVER_USER }}@${{ vars.EXTERNAL_SERVER_IP_ADDR }} "bash -s" << 'EOF'
            set -euo pipefail

            cd ${{ vars.EXTERNAL_SERVER_DESTINATION }}

            OLD_ID=$(docker images --filter=reference='raschetka:latest' --format '{{.ID}}')
            gunzip raschetka.tar.gz
            docker load -i raschetka.tar
            rm raschetka.tar

            docker compose up -d --no-build

            if [ -n "$OLD_ID" ]; then docker rmi "$OLD_ID" --force; fi
          EOF

      # В отправленном сообщении пишем статус деплоя
      - name: Notify finish (edit message)
        run: |
          case "${{ job.status }}" in
            success)   STATUS="✅ Успешный деплой" ;;
            cancelled) STATUS="⚪️ Деплой отменён" ;;
            *)         STATUS="❌ Деплой сломался" ;;
          esac

          TEXT="$(printf '%s\n\n%s' "$STATUS" "${{ steps.notify_start.outputs.job_url }}")"

          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/editMessageText" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d message_id="${{ steps.notify_start.outputs.message_id }}" \
            -d disable_web_page_preview=true \
            --data-urlencode text="$TEXT"
