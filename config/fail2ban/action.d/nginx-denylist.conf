[Definition]
actionstart =
actionstop =
actioncheck =
actionban = sh -c 'echo "deny <ip>;" >> /var/lib/denylist/denylist.conf && nginx -s reload'
actionunban = sh -lc 'tmp=$(mktemp); grep -vE "^[[:space:]]*deny[[:space:]]+<ip>;" /var/lib/denylist/denylist.conf > "$tmp" && cat "$tmp" > /var/lib/denylist/denylist.conf && rm -f "$tmp" && nginx -s reload'
